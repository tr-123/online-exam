<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exam Camera Monitor</title>
<style>
body{margin:0;background:#111827;color:#fff;font-family:system-ui;text-align:center}
.wrap{padding:16px}
video{width:min(100%,480px);background:#000;border:3px solid #10b981;border-radius:12px;transform:scaleX(-1)}
#status{margin:12px;font-weight:700}
.ok{color:#34d399}
.bad{color:#f87171}
small{color:#9ca3af}
</style>
</head>
<body>
<div class="wrap">
  <h2>Exam Camera</h2>
  <video id="video" autoplay playsinline muted></video>
  <div id="status">Starting...</div>
  <small>Keep your face visible and keep this window open. Detection uses persistent multi-frame confirmation.</small>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7/dist/blazeface.min.js"></script>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');
const backend = params.get('backend');

const video = document.getElementById('video');
const statusEl = document.getElementById('status');

const NO_FACE_MS = 2000;
const MULTI_FACE_MS = 2000;
const COOLDOWN_MS = 15000;

const REQUIRED_FACE_FRAMES = 5;
const REQUIRED_NO_FACE_FRAMES = 5;
const REQUIRED_MULTI_FACE_FRAMES = 4;
const MIN_FACE_PROBABILITY = 0.70;

// Lightweight advanced detections derived from BlazeFace keypoints.
// These are head/mouth-motion heuristics, not full iris/gaze or speech models.
const LOOK_AWAY_MS = 3000;
const REQUIRED_LOOK_AWAY_FRAMES = 8;
const LOOK_AWAY_RESET_FRAMES = 5;
const HEAD_YAW_THRESHOLD = 0.30;
const HEAD_PITCH_THRESHOLD = 0.38;

// Mouth movement is estimated from the BlazeFace mouth keypoint moving
// relative to the eyes. It detects visible mouth motion, not speech itself.
const MOUTH_MS = 3000;
const REQUIRED_MOUTH_FRAMES = 10;
const MOUTH_RESET_FRAMES = 5;
const MOUTH_MOVEMENT_THRESHOLD = 0.075;

// 250 ms face-detection cycle.


const REQUIRED_PHONE_FRAMES = 2;

let model = null;

let stream = null;
let running = true;

let noFaceSince = 0;
let multiSince = 0;

let faceFrames = 0;
let noFaceFrames = 0;
let multiFaceFrames = 0;
let lookAwaySince = 0;
let lookAwayFrames = 0;
let lookAwayGoodFrames = 0;


let mouthSince = 0;
let mouthFrames = 0;
let mouthGoodFrames = 0;
let mouthHistory = [];

let lastUpload = 0;
let uploading = false;

function status(t, bad=false) {
  statusEl.textContent = t;
  statusEl.className = bad ? 'bad' : 'ok';
}

function postStatus(s,msg='') {
  if (window.opener) {
    window.opener.postMessage({
      type:'EXAM_CAMERA_STATUS',
      status:s,
      message:msg,
      token:token
    },'*');
  }
}

function getReliableFaces(faces) {
  return faces.filter(face => {
    const p = Array.isArray(face.probability)
      ? Number(face.probability[0])
      : Number(face.probability);

    return !Number.isFinite(p) || p >= MIN_FACE_PROBABILITY;
  });
}

async function start() {
  if (!token || !backend) {
    status('Invalid camera session.',true);
    postStatus('ERROR','Invalid camera session');
    return;
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:false
    });

    video.srcObject = stream;
    await video.play();

    status('Loading face detector...');
    model = await blazeface.load();

    status('Camera monitoring ACTIVE');
    postStatus('READY');

    // is already running. It is then invoked only once every 3 seconds.
    setTimeout(() => loadPhoneModel(), 1000);

    monitor();

  } catch(e) {
    console.error(e);
    status('Camera error: '+e.name,true);
    postStatus('ERROR',e.name+': '+e.message);
  }
}

async function monitor() {
  while (running) {
    if (video.readyState >= 2 && model) {
      try {
        const faces = await model.estimateFaces(video,false);
        const reliableFaces = getReliableFaces(faces);
        const count = reliableFaces.length;
        const now = Date.now();

        if (count === 0) {
          noFaceFrames++;
          faceFrames=0;
          multiFaceFrames=0;
          multiSince=0;
          lookAwayFrames=0;
          lookAwaySince=0;
          mouthFrames=0;
          mouthSince=0;
          mouthHistory=[];

          if (!noFaceSince) noFaceSince=now;
          if (noFaceFrames >= REQUIRED_NO_FACE_FRAMES && now-noFaceSince >= NO_FACE_MS) {
            await violation('NO_FACE');
            noFaceSince=0;
            noFaceFrames=0;
          }
          status('Face not detected...',true);

        } else if (count > 1) {
          multiFaceFrames++;
          faceFrames=0;
          noFaceFrames=0;
          noFaceSince=0;

          if (!multiSince) multiSince=now;
          if (multiFaceFrames >= REQUIRED_MULTI_FACE_FRAMES && now-multiSince >= MULTI_FACE_MS) {
            await violation('MULTIPLE_FACES');
            multiSince=0;
            multiFaceFrames=0;
          }
          status('Multiple faces detected',true);

        } else {
          faceFrames++;
          noFaceFrames=0;
          multiFaceFrames=0;
          noFaceSince=0;
          multiSince=0;

          evaluateAdvancedDetections(reliableFaces[0], now);

          if (faceFrames >= REQUIRED_FACE_FRAMES) status('Face detected');
        }

      } catch(e) {
        console.error('Face detection error:',e);
      }
    }

    await new Promise(r=>setTimeout(r,250));
  }
}

function evaluateAdvancedDetections(face, now) {
  const kp = face && face.landmarks;
  if (!kp || kp.length < 6) return;

  // BlazeFace keypoints are: right eye, left eye, nose, mouth,
  // right ear, left ear. We use the nose position relative to the eyes
  // and the eye-to-eye width as a lightweight head-orientation estimate.
  const rightEye = kp[0];
  const leftEye = kp[1];
  const nose = kp[2];
  const mouth = kp[3];

  const eyeMidX = (rightEye[0] + leftEye[0]) / 2;
  const eyeMidY = (rightEye[1] + leftEye[1]) / 2;
  const eyeWidth = Math.max(1, Math.abs(leftEye[0] - rightEye[0]));

  const yaw = Math.abs(nose[0] - eyeMidX) / eyeWidth;
  const pitch = (nose[1] - eyeMidY) / eyeWidth;

  const lookingAway =
    yaw > HEAD_YAW_THRESHOLD ||
    pitch < -HEAD_PITCH_THRESHOLD ||
    pitch > HEAD_PITCH_THRESHOLD;

  if (lookingAway) {
    // Require several consecutive confirming frames.
    lookAwayFrames++;
    lookAwayGoodFrames = 0;

    if (!lookAwaySince) lookAwaySince = now;

    if (
      lookAwayFrames >= REQUIRED_LOOK_AWAY_FRAMES &&
      now - lookAwaySince >= LOOK_AWAY_MS
    ) {
      violation('LOOKING_AWAY');

      // Do not immediately forget the state. This prevents one borderline
      // frame from causing the detector to start over.
      lookAwayFrames = 0;
      lookAwaySince = now;
      lookAwayGoodFrames = 0;
    }
  } else {
    // Like NO_FACE/MULTIPLE_FACES, tolerate a few good frames before
    // declaring that the looking-away condition has actually cleared.
    lookAwayGoodFrames++;

    if (lookAwayGoodFrames >= LOOK_AWAY_RESET_FRAMES) {
      lookAwayFrames = 0;
      lookAwaySince = 0;
      lookAwayGoodFrames = 0;
    }
  }

  // BlazeFace has only one mouth keypoint, so this is intentionally a
  // mouth-motion detector rather than a true mouth-opening/speech detector.
  const mouthX = (mouth[0] - eyeMidX) / eyeWidth;
  const mouthY = (mouth[1] - eyeMidY) / eyeWidth;
  const mouthPosition = Math.hypot(mouthX, mouthY);

  mouthHistory.push({ t: now, v: mouthPosition });
  mouthHistory = mouthHistory.filter(x => now - x.t <= MOUTH_MS);

  let min = Infinity, max = -Infinity;
  for (const x of mouthHistory) {
    min = Math.min(min, x.v);
    max = Math.max(max, x.v);
  }

  const mouthMoving =
    mouthHistory.length >= REQUIRED_MOUTH_FRAMES &&
    (max - min) >= MOUTH_MOVEMENT_THRESHOLD;

  if (mouthMoving) {
    mouthFrames++;
    mouthGoodFrames = 0;

    if (!mouthSince) mouthSince = now;

    if (
      mouthFrames >= REQUIRED_MOUTH_FRAMES &&
      now - mouthSince >= MOUTH_MS
    ) {
      violation('MOUTH_MOVEMENT');

      // Keep the detector latched briefly so a single quiet frame doesn't
      // reset the detection immediately.
      mouthFrames = 0;
      mouthSince = now;
      mouthGoodFrames = 0;
      mouthHistory = [];
    }
  } else {
    // Require several consecutive non-moving frames before clearing the
    // mouth-movement state.
    mouthGoodFrames++;

    if (mouthGoodFrames >= MOUTH_RESET_FRAMES) {
      mouthFrames = 0;
      mouthSince = 0;
      mouthGoodFrames = 0;
      // Keep a short history so normal frame-to-frame noise doesn't erase
      // the movement signal instantly.
    }
  }
}





async function violation(type) {
  const now = Date.now();
  if (violationUploadInProgress) return;
  if (now - lastUpload < COOLDOWN_MS) return;

  violationTimestamps = violationTimestamps.filter(
    t => now - t < VIOLATION_WINDOW_MS
  );
  if (violationTimestamps.length >= MAX_VIOLATIONS_PER_MINUTE) {
    status('Violation limit reached: maximum 5 recorded violations in the last minute.', true);
    return;
  }

  // Reserve the slot before the asynchronous upload starts.
  violationUploadInProgress = true;
  lastUpload = now;
  violationTimestamps.push(now);

  status('Violation detected: ' + type, true);

  try {
    const image = capture();
    const result = await upload(type, image);

    if (result && result.ok === false) {
      violationTimestamps = violationTimestamps.filter(t => t !== now);
      status('Upload failed: ' + (result.error || 'unknown error'), true);
    } else {
      status('Violation recorded: ' + type, true);
    }
  } catch (e) {
    violationTimestamps = violationTimestamps.filter(t => t !== now);
    status('Upload error: ' + (e.message || e), true);
  } finally {
    violationUploadInProgress = false;
  }
}

function capture() {
  const c=document.createElement('canvas');
  const maxW=640;
  const s=Math.min(1,maxW/video.videoWidth);

  c.width=Math.round(video.videoWidth*s);
  c.height=Math.round(video.videoHeight*s);

  const ctx=c.getContext('2d');
  ctx.drawImage(video,0,0,c.width,c.height);

  return c.toDataURL('image/jpeg',0.72);
}

/*
 * Apps Script web apps do not reliably expose their response to a
 * cross-origin hidden iframe. Therefore this function confirms that the
 * browser submitted the POST, but cannot always confirm the server result.
 *
 * Actual success/failure is visible in Apps Script Executions.
 */
function upload(type,image) {
  return new Promise(resolve => {
    const frameName='cameraUploadTarget_'+Date.now();

    const f=document.createElement('form');
    f.method='POST';
    f.action=backend;
    f.target=frameName;
    f.enctype='application/x-www-form-urlencoded';

    const frame=document.createElement('iframe');
    frame.name=frameName;
    frame.style.display='none';

    document.body.appendChild(frame);

    [
      ['token',token],
      ['violation',type],
      ['image',image]
    ].forEach(([n,v]) => {
      const i=document.createElement('input');
      i.type='hidden';
      i.name=n;
      i.value=v;
      f.appendChild(i);
    });

    document.body.appendChild(f);

    let finished=false;

    const finish=result => {
      if(finished)return;
      finished=true;
      clearTimeout(timer);
      f.remove();
      frame.remove();
      resolve(result);
    };

    const timer=setTimeout(() => {
      finish({ok:true,submitted:true});
    },5000);

    try {
      f.submit();
    } catch(e) {
      finish({ok:false,error:e.message});
    }
  });
}

window.addEventListener('message',e => {
  if (
    !e.data ||
    e.data.type!=='EXAM_COMMAND' ||
    e.data.token!==token
  ) return;

  if(e.data.command==='STOP') {
    running=false;

    if(stream) {
      stream.getTracks().forEach(t=>t.stop());
    }

    postStatus('STOPPED');
    window.close();
  }
});

window.addEventListener('beforeunload',() => {
  if(running) {
    postStatus('STOPPED','Camera window closed');
  }
});

start();
</script>
</body>
</html>
